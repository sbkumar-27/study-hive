server:
  # Render (and most PaaS hosts) inject PORT at runtime and expect the app to bind to it;
  # SERVER_PORT remains the local-dev override, 8080 the final fallback.
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: studyhive-backend
  datasource:
    # yearIsDateType=false: the question_papers.exam_year column is a MySQL YEAR; without this,
    # Connector/J reports it to Hibernate as java.sql.Date, and writing a converted Date back
    # into it fails under strict SQL mode ("Data truncated for column 'exam_year'"). With it off,
    # the driver treats YEAR as a SMALLINT, matching the entity's Short mapping below.
    # sslMode=REQUIRED (default): encrypts the connection, which managed hosts like Aiven mandate,
    # without needing a custom truststore for cert verification. Override via DB_SSL_MODE only if
    # a given host needs stricter verification (VERIFY_CA/VERIFY_IDENTITY) or, for plain local
    # MySQL with no TLS configured, DISABLED.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:studyhive}?sslMode=${DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&yearIsDateType=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE_MB:25}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:25}MB

studyhive:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-change-me-now-32bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    # local (default) or catalyst -- see CatalystFileStoreStorageProvider
    provider: ${STORAGE_PROVIDER:local}
    root: ${STORAGE_ROOT:./storage}
    max-upload-size-mb: ${MAX_UPLOAD_SIZE_MB:25}
    allowed-extensions: pdf,doc,docx,ppt,pptx,txt,png,jpg,jpeg
    catalyst:
      client-id: ${CATALYST_CLIENT_ID:}
      client-secret: ${CATALYST_CLIENT_SECRET:}
      refresh-token: ${CATALYST_REFRESH_TOKEN:}
      project-id: ${CATALYST_PROJECT_ID:}
      project-key: ${CATALYST_PROJECT_KEY:}
      domain: ${CATALYST_DOMAIN:}
      environment: ${CATALYST_ENVIRONMENT:}
      folder-id: ${CATALYST_FOLDER_ID:}
    supabase:
      url: ${SUPABASE_URL:}
      service-key: ${SUPABASE_SERVICE_KEY:}
      bucket: ${SUPABASE_BUCKET:}
  cors:
    web-app-origin: ${WEB_APP_ORIGIN:http://localhost:5173}

logging:
  level:
    com.studyhive: INFO
